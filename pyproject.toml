[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-gl"
version = "0.1.2"
description = "A framework for running AI agent workflows against code repositories."
# This file rendered *is* the body of the PyPI project page; there is no other prose on it.
readme = "README.md"
requires-python = ">=3.14"
# The SPDX expression and not the `{ text = "MIT" }` table, which PEP 639 deprecated. Hatchling has
# accepted the string form since 1.27 and the build resolves 1.32, so there is no older backend to
# keep a fallback for.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jan", email = "janwylegalaandrzej@gmail.com" }]
keywords = ["agents", "workflows", "llm", "git", "orchestration"]
# `Development Status :: 3 - Alpha` is the one entry here that is a judgement rather than a fact,
# and it is the version above and the README's warning about the surface said a third time.
# No `License ::` classifier: PEP 639 deprecates that whole family, and `license` above replaces it
# - a project carrying both is stating the same thing in a live field and a dead one.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Version Control :: Git",
]
# Both SDKs unconditional, and that is not vendor containment being walked
# back: what contains a vendor is `[tool.importlinter]`'s contract 3 and `config/container.py`
# importing each one inside the function that constructs it, and neither of those reads package
# metadata. `rich` could not be optional in any case - `container.py`'s real composition root
# refuses a run outright when it cannot be imported, there being no headless display for `real()` to
# fall back to. Nothing here for the OpenAI connector: that adapter drives the Codex CLI *binary*,
# which is installed separately, so there is no distribution for this list to name.
#
# `packaging` is the one member that is no vendor SDK, and `NOT_A_VENDOR` in
# tests/test_contract_listings.py is where that exception is written down rather than assumed.
# `config/distribution.py` reads the `agents-gl` bound a workflow declares in its own pyproject.toml
# and asks whether the AGL running satisfies it. PEP 440 is a grammar and not an ordering of text -
# `"0.0.10" >= "0.0.2"` is False as strings and true as versions - so the comparison is
# `packaging.specifiers`' and nothing here compares strings. It arrives today as a transitive
# dependency of pytest, which is a dev tool: an `agl` installed by an operator gets what this list
# names and nothing a `[dependency-groups]` entry pulled in beside it.
#
# `claude-agent-sdk` is pinned to the one release that bundles Claude Code 2.1.283, the version
# `adapters/claude_code/_version.py` names as tested. The adapter starts the bundled binary
# unless `cli_path` names another, so a looser bound installs a newer one and Claude runs warn.
dependencies = ["claude-agent-sdk==0.2.160", "packaging>=25.0", "rich>=15.0.0"]

# Homepage and Repository both point at the repository, and there is no tracker apart from the
# repo's own. Two labels rather than one because PyPI lists each by name in its sidebar, so a
# reader scanning for either finds it.
[project.urls]
Homepage = "https://github.com/jashioq/AGL"
Repository = "https://github.com/jashioq/AGL"
Documentation = "https://agents-gl.org"

[project.scripts]
agl = "agl.cli.main:main"

# No [project.entry-points."agl.workflows"] table, and a line written here would be read by nothing.
# `agl.config.registry`'s `discovered` synthesises its entry points by walking the operator's own
# workspace - one per declaration found under `workspace/workflows/` - and calls
# `importlib.metadata.entry_points()` nowhere, so neither this distribution nor one installed beside
# it registers a workflow through package metadata. What survives of the group is its name, which is
# the table key a workflow directory in that workspace writes. `tests/test_measurable_targets.py` is
# what keeps this table empty.

# What it takes to *work on* AGL, which is not what it takes to install it. A PEP 735 dependency
# group is not part of a built distribution: nothing below reaches a `pip install agents-gl`, and
# adding a line here adds nothing to what an operator gets.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "mypy>=2.3.1",
    "ruff>=0.16.3",
    "import-linter>=2.13",
]

# Exact pins: Zensical is 0.0.x and releases weekly, and `uv.lock` is gitignored.
docs = [
    "zensical==0.0.63",
    "mkdocstrings==1.0.6",
    "mkdocstrings-python==2.0.8",
    # Griffe's library; the `griffe` distribution adds only its command line.
    "griffelib==2.3.0",
    "pymdown-extensions==12.0.1",
    "llmstxt-standalone==0.2.0",
    "lychee-bin==0.24.2",
]

# `docs` beside `dev`, so a plain `uv sync` installs every tool `scripts/check` runs.
[tool.uv]
default-groups = ["dev", "docs"]

# An allowlist, because hatchling's default sdist is everything the root `.gitignore` does not
# exclude, and this repository is not shaped like a package. Measured with this table deleted, that
# default builds a 1.6 MB archive around a 265 KB wheel: the whole of `tests/`, `docs/`,
# `scripts/`, `.github/`, `.claude/` and both tool caches - `.grimp_cache/` and
# `.import_linter_cache/` - all ride along.
# An upload is irrevocable and the version number cannot be reissued once it is on PyPI, so the
# failure worth designing against is something shipping that was never meant to leave this machine.
# As an allowlist, a directory added to the repo tomorrow does not ship until it is named here; as
# exclusions, it ships until somebody notices.
#
# `AGENTS.md` is in the list because `src/`'s comments cite its headings by name, so it is the one
# document the shipped source refers to.
#
# Every pattern is anchored with a leading `/`, and that slash is load-bearing rather than tidy.
# Hatchling reads these as gitignore patterns, where a bare `README.md` matches at *any* depth and
# ships every nested one. Anchored, each name means the repository root and nothing else.
[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md", "/LICENSE", "/AGENTS.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/agl"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# `scratchpad/` holds throwaway working files. It is not part of the package, and a stray `.py` in
# it fails the lint gate.
extend-exclude = ["scratchpad"]

[tool.ruff.lint]
# `N` is pep8-naming, and it is what makes the naming convention mechanical rather
# than a thing reviewers remember: N801 for classes, N806 for locals, N803 for arguments, N815 for
# class attributes. The rules `N` cannot see - a past participle on a `-> None` function, `_check_x`
# against `_checked_x`, a `ports/` type redefined elsewhere, a test name that is not a sentence -
# are in `tests/test_naming_convention.py`, and the two are meant to be read together.
select = ["E", "F", "I", "UP", "B", "N"]

# N818 wants every exception named `...Error`, and AGL's are named for what happened. `Stop` is the
# case that settles it: it is on the SDK front door, exported from `agl.sdk`
# alongside `@workflow` and `Run`, and a workflow author raises it to end a run - `StopError` would
# be a worse name for the thing an author writes. `ports/errors.py`'s `UpstreamUnavailable` and
# `UpstreamUnexpected` read the same way, and thirteen test exceptions under nine names are
# deliberately named so that a failure reads as a sentence: `_Barricade`, `Wobble`, `Exploded`,
# `_Crash`, `ToolFailed`, `ReporterFailed`, `Refused`, `Interrupted`, `_UnmappedBranch`. The base
# class is what makes them errors; the name is what says which one. Repo-wide because the decision
# is repo-wide - the hierarchy in `ports/errors.py` is where it is made and every test class
# follows it - and this is the only one of pep8-naming's rules that is off. Note that a `ruff
# check --select N` on the command line outranks this line and reports all sixteen again; the lint
# gate runs a bare `ruff check`, which reads it.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# `do_HEAD`, `do_GET`, `do_POST` and their four siblings are `http.server`'s dispatch table:
# `BaseHTTPRequestHandler.handle_one_request` looks up `"do_" + command` by exact spelling, so the
# capitals are the standard library's and not ours to rename. That is `AGENTS.md`'s "Prose in
# `src/`" rule to mirror vendor spellings, applied to the stdlib. Scoped to the one file
# rather than ignored globally, so the exemption says where it applies - a `do_GET` written
# anywhere else is a mistake and still fails.
"tests/instruments/loopback.py" = ["N815"]

[tool.ruff.lint.isort]
# `tests/test_blank_line_convention.py` asks for one contiguous import block. `no-lines-before`
# governs the separators *inside* that block - it is what stops `I001` splitting the five sections
# - and `lines-after-imports` governs the gap *after* it: isort's default of `-1` writes two blank
# lines before a following `def` or `class`, where the convention wants one, and set against each
# other the two never converge. Not `ignore = ["I001"]`: the sorting is worth keeping.
#
# Nothing is ignored for the rest of that convention, and that is not an omission. `ruff`'s E3
# blank-line rules - one between top-level definitions, none under a `class` statement, none at the
# top of a file - are preview-only and not in the select list above, so no rule here objects to any
# of the three. `tests/test_blank_line_convention.py` is what holds the whole of it.
no-lines-before = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-after-imports = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

# A ceiling on how long any single test may take, and it is a *backstop* rather than a bound.
#
# What it is for: a test that hangs is worse than one that fails. A failure names a clause; a hang
# stalls the run, and a mutation that survived is then indistinguishable from a machine that wedged.
# `tests/sdk/test_leases.py`'s `test_release_all_gives_back_every_live_lease_and_not_merely_one` is
# the case that bought this - two `await leases.claim(...)` calls on two different targets, neither
# of them under a bound, so a lease made coarser than per-target suspends the second one forever -
# and the very next test in that file is the one whose docstring promises "nothing here can hang
# and pass". Whatever else that pair is, it is not the last one anybody will write, which is the
# argument for a **global default** over a marker on whichever tests somebody already thought
# about: the same argument `scripts/check`'s paid-endpoint probe makes when it writes a file that
# did not exist when the guard did. A default protects the test
# written next year; a marker protects the test whose author already knew.
#
# Why 60: measured, not guessed. `pytest --durations=20` puts the slowest single test in this suite
# at 2.48s (`tests/ports/test_ids.py`'s property run over real `git check-ref-format`) and the whole
# suite at ~172s. 60s is 24x the slowest test and about a third of the entire run, so a test that
# reaches it is not slow - it is not coming back. The one declared bound above it is
# `tests/contracts/_agent_tasks.py`'s `RUN_DEADLINE = 300.0`, which is reachable only against a live
# paid agent that no run in this build starts; a manual QA pass that does start one raises the
# ceiling on the command line - `--timeout=600`, or `--timeout=0` for none.
#
# Why `signal` and not `thread`, spelled out because the default is platform-dependent and the two
# fail differently. `signal` raises inside the test, so the hang is reported as a normal failure
# with a traceback and the rest of the suite still runs. `thread` cannot interrupt a blocked
# `await` at all: its watchdog dumps every thread's stack and hard-exits the process, so there is no
# failure line, no summary, and no result for any test after it. Both were run against a real
# `await asyncio.Event().wait()` before this line was written - `signal` reported three timeouts as
# three failures in 11s, `thread` killed pytest with no counts at all.
#
# What it does not replace: a test bounding its own awaits. `test_leases.py`'s neighbouring claims
# are awaited under `asyncio.wait_for(..., _LIVENESS)` and fail with a paragraph naming the lease
# that was not given back and what a coarser one would cost; this fails with "Timeout (>60.0s)" and
# a traceback into the event loop's selector. That is the difference between a test that says what
# broke and a test that says only that something did. This is the floor under the awaits nobody
# bounded, not permission to stop bounding them.
timeout = 60
timeout_method = "signal"

# AGL's import contracts - the executable form of AGENTS.md's "Layers".
#
# Run them with `.venv/bin/lint-imports`, or (alongside every other gate) `scripts/check`.
# A broken contract is a failing build, not a suggestion: if a contract here blocks a change,
# either the change is in the wrong layer, or the architecture moved - and then
# AGENTS.md's "Layers" is what changes first, and this table second.
#
# Contract numbers are stable, and what makes them load-bearing is inside this repository: a
# number here is the contract `id` import-linter itself reads. Three test modules resolve one
# against this table - tests/test_contract_firing.py's CONTRACT_TYPES builds a contract object per
# number, tests/test_contract_listings.py names three contracts as constants, and
# tests/test_measurable_targets.py's _contract looks one up - so a renumbering fails the build.
[tool.importlinter]
root_package = "agl"
# Contract 3 forbids two *external* packages (claude_agent_sdk, rich), so the graph has to
# extend past agl's own modules to see imports leaving the package.
include_external_packages = true

# 1. The one dependency rule, high to low. `sdk` and `adapters` sit at the same level and are
#    independent of each other: `|` means neither may import the other (`:` would mean they may).
#    `agl.testing` joins `agl.cli` at the top for the same reason: it is the harness
#    a workflow author tests against, it imports `agl.api` and `agl.config` exactly as `agl.cli`
#    does, and nothing in AGL imports it - so it is a sibling of the CLI rather than a layer of its
#    own, and the `|` is what says the two may not import each other.
#    Fail-closed, and it is `containers` plus `exhaustive = true` that made it so. An earlier
#    spelling named absolute modules in `layers =`, and this contract then had no opinion about one
#    it did not mention: a top-level member nobody added below was not at the bottom of the stack
#    but outside it, free to import anything with every contract still kept, and a hand-maintained
#    meta-test in tests/test_contract_listings.py was what noticed. Naming `agl` as the container
#    makes the layers relative names and lets `exhaustive` require that every child of `agl` is one
#    of them,
#    so an unlisted package now breaks this contract and is named in the failure. The rewrite
#    changes nothing about the ordering, and that is measured rather than assumed: every fabricated
#    violation in tests/test_contract_firing.py, plus both directions of each `|` pair, was run
#    against the old spelling and this one and returned an identical verdict. `api` layers as a
#    module (src/agl/api.py) exactly as a package does - a layer only has to be in the graph, not
#    be a directory.
#    Two things `exhaustive` still does not reach, and neither is a hand-maintained list. Grimp
#    models src/agl/__init__.py as the module `agl` itself, so it is the container rather than a
#    child of it and no layer orders it or could; scripts/check's package-root gate - that file
#    holds no import statements at all - is what guards it, as contract 5's comment says of the
#    same file for its own reason. And a layer wrapped in parentheses is import-linter's spelling
#    for one whose absence is tolerated, which makes it the one entry here that could name a module
#    that does not exist and be reported by nobody: a required layer missing from the graph is
#    refused outright, an optional one is skipped. There are none below; adding one is the moment
#    to ask why.
[[tool.importlinter.contracts]]
id = "1"
name = """\
    Layers flow one way only: {cli, testing} -> api -> config -> {sdk, adapters} -> ports, \
    neither pair imports the other, and every top-level member of agl is one of them"""
type = "layers"
containers = ["agl"]
exhaustive = true
layers = [
    "cli | testing",
    "api",
    "config",
    "sdk | adapters",
    "ports",
]

# 2. Ring 1 has an inner ring: a type an ABC speaks must not depend on the ABC that speaks it,
#    so the pure types stay importable by anything without dragging in the port interfaces.
#    Fails open twice over, these being two hand-maintained lists: a ports/ module missing from
#    `source_modules` may import any ABC, and one missing from `forbidden_modules` may be imported
#    by every pure type. tests/test_contract_listings.py requires every one of them on exactly one.
[[tool.importlinter.contracts]]
id = "2"
name = "Pure types in agl.ports never import the ABCs that speak them"
type = "forbidden"
source_modules = [
    "agl.ports.errors",
    "agl.ports.ids",
    "agl.ports.run",
    "agl.ports.home_layout",
    "agl.ports.tree_layout",
    "agl.ports.get_request",
]
forbidden_modules = [
    "agl.ports.agent",
    "agl.ports.workspace",
    "agl.ports.integration",
    "agl.ports.history",
    "agl.ports.verifier",
    "agl.ports.store",
    "agl.ports.sync",
    "agl.ports.terminal",
    "agl.ports.clock",
    "agl.ports.fetch",
]

# 3. Vendor containment: each vendor SDK is imported by exactly one adapter package. Both SDKs are
#    [project] dependencies, so an import this contract refuses would otherwise succeed.
#    Fail-closed on its source side - that is the whole `agl` tree, so any package added in a
#    later stage is covered the moment it exists; only the two expressions below escape. The
#    forbidden side is the hand-maintained half and fails open: a third vendor SDK is contained by
#    nothing at all. tests/test_contract_listings.py is what notices - it reads [project]
#    dependencies in pyproject.toml, which is where a vendor SDK actually gets added, and compares.
#    `allow_indirect_imports = true` makes this a rule about import statements, which is what
#    "imported only inside X" means: the container legitimately reaches claude_agent_sdk
#    *through* agl.adapters.claude_code, and that path is not a violation.
[[tool.importlinter.contracts]]
id = "3"
name = """\
    A vendor SDK is imported only by its own adapter: claude_agent_sdk only inside \
    agl.adapters.claude_code, rich only inside agl.adapters.rich_terminal"""
type = "forbidden"
source_modules = ["agl"]
forbidden_modules = ["claude_agent_sdk", "rich"]
allow_indirect_imports = true
ignore_imports = [
    "agl.adapters.claude_code.** -> claude_agent_sdk",
    "agl.adapters.rich_terminal.** -> rich",
]
# Those two are the only permitted vendor imports in the repo, and they are held to import-linter's
# default alerting: an ignore expression matching nothing in the graph is an error, so an exception
# granted here stops being granted the moment nothing needs it. That default was suppressed with
# `unmatched_ignore_imports_alerting = "none"` while the tree was empty and all four expressions
# matched nothing; the suppression is gone, which is what this comment is now about. `warn` was the
# other candidate and lost: a warning does not fail scripts/check, and a report that fails nothing
# stops being read - which is how the debt got old in the first place.
# What the flip found: `agl.adapters.claude_code -> claude_agent_sdk` and
# `agl.adapters.rich_terminal -> rich` had been stale since the adapters were written, and are
# gone above. Those two named the *package roots* - src/agl/adapters/claude_code/__init__.py and
# src/agl/adapters/rich_terminal/__init__.py - and both are empty files; the SDK imports live in
# the modules beside them, which is what `.**` covers. The import was not missing and has not been
# added: `.**` matches every descendant and not the package
# itself, so if an `__init__.py` ever does need its vendor, this contract breaks and the expression
# comes back with somebody having been asked. That is the exception being granted deliberately
# rather than inherited.
# The setting is absent rather than written out as `error`. The default is the rule this contract
# wants and restating it would put the same decision in two places, one of which could drift; the
# argument for wanting it is the paragraph above, which no key could hold.

# 4. Adapters are peers: each stands alone behind its port, and swapping one never disturbs
#    another. agl.adapters.routing is deliberately excluded from this contract - it is the one
#    adapter module permitted to import other adapters, because dispatching on
#    task.model.provider to the vendor runners is its entire job.
#    A member here is an adapter, not a directory: agl.adapters.system_clock is a single module
#    because its port is one method, and it is listed for the same reason every package is. Being
#    one file makes it no kind of exception - it is an ordinary peer that happens not to need a
#    directory, and leaving it out would have left it free to import agl.adapters.git with every
#    contract still kept, since contract 5 skips the (agl.adapters, agl.adapters) pair.
#    Fails open, like contract 2 and like contract 3's forbidden half, and unlike contracts 1 and
#    5: this list is hand-maintained, so an adapter added at a later stage is unpoliced until
#    someone edits it. tests/test_contract_listings.py is what notices - it walks
#    src/agl/adapters/ and fails if anything there is missing from this list.
[[tool.importlinter.contracts]]
id = "4"
name = "No adapter imports another adapter (agl.adapters.routing is the one sanctioned exception)"
type = "independence"
modules = [
    "agl.adapters.claude_code",
    "agl.adapters.openai",
    "agl.adapters.git",
    "agl.adapters.shell",
    "agl.adapters.filesystem",
    "agl.adapters.rich_terminal",
    "agl.adapters.system_clock",
    "agl.adapters.uv",
    "agl.adapters.github",
]

# 5. The composition root: config/container.py is the only module that says `new`.
#    Fail-closed - the source is `agl.*`, every top-level package under agl, which re-expands as
#    packages are added rather than being a hand-maintained list of modules that would silently
#    miss agl/config/__init__.py and anything a later stage introduces.
#    The (agl.adapters, agl.adapters) pair is skipped as self-overlapping, which is exactly why
#    contract 4 exists to police imports *between* adapters.
#    Blind spot: `agl.*` does not include `agl` itself, and adding it changes nothing - the pair
#    (agl, agl.adapters) is skipped as overlapping too. So src/agl/__init__.py, and only that
#    file, could import an adapter with every contract still kept; the package-root gate in
#    scripts/check - that file holds no import statements at all - is what guards it. Do not
#    drop that gate. (Named, not numbered: gates get inserted, and the numbers move.)
#    `allow_indirect_imports = true` for the same reason as contract 3: cli -> config.container
#    -> adapters is the sanctioned wiring path, and only the direct import is the violation.
[[tool.importlinter.contracts]]
id = "5"
name = """\
    Only agl.config.container imports agl.adapters: the composition root is the one place that \
    may name an adapter"""
type = "forbidden"
source_modules = ["agl.*"]
forbidden_modules = ["agl.adapters"]
allow_indirect_imports = true
ignore_imports = ["agl.config.container -> agl.adapters.**"]
# One expression, held to import-linter's default alerting, for contract 3's reasons and with the
# same history: `unmatched_ignore_imports_alerting = "none"` was set here while the container
# constructed nothing and neither expression matched, and has since been removed. The flip
# found `agl.config.container -> agl.adapters` stale and it is gone above - that expression named
# the adapters package itself, and the composition root has never imported it as a whole. It
# imports the modules it constructs from (`from agl.adapters.git.workspace import ...`), which is
# what `.**` matches and is also the only shape a composition root has any use for. If the bare
# package is ever imported here this contract breaks, and that is the right moment to ask what a
# module wanted with `agl.adapters` and nothing under it.
