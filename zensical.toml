[project]
site_name = "AGL"
site_url = "https://agents-gl.com/"
repo_url = "https://github.com/jashioq/AGL"
docs_dir = "docs"
site_dir = "site"
strict = true
nav = [
  { "Home" = "index.md" },
  { "Build workflows" = [
    { "Run" = [
      { "Run" = "sdk/run.md" },
      { "Run.step" = "sdk/run-step.md" },
      { "Run.worktree" = "sdk/run-worktree.md" },
      { "Run.integrate" = "sdk/run-integrate.md" },
    ] },
  ] },
  { "Examples" = ["examples/index.md"] },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  # Renders the HTML that autorefs puts in link titles as tooltips.
  "content.tooltips",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Listing any extension replaces all of Zensical's defaults (zensical#508).
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
# Resolved against the working directory, so build from the repository root.
pymdownx.snippets.base_path = ["tests/docs"]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
# Tables split at the `|` of a union type in the Markdown copies.
docstring_section_style = "list"
show_root_heading = true
# mkdocstrings shows source by default.
show_source = false
relative_crossrefs = true
scoped_crossrefs = true

# Zensical ignores this table; llmstxt-standalone reads it after the build.
[project.plugins.llmstxt]
markdown_description = "AGL runs AI agent workflows against code repositories."
full_output = "llms-full.txt"

# Only the pages listed here get a Markdown copy, and with none listed the check fails.
[project.plugins.llmstxt.sections]
"Pages" = ["index.md"]
"Build workflows" = [
  "sdk/run.md",
  "sdk/run-step.md",
  "sdk/run-worktree.md",
  "sdk/run-integrate.md",
]
"Examples" = ["examples/index.md"]
