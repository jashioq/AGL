[project]
site_name = "AGL"
site_url = "https://agents-gl.org/"
repo_url = "https://github.com/jashioq/AGL"
docs_dir = "docs"
site_dir = "site"
strict = true
nav = [
  { "Home" = "index.md" },
  { "Run workflows" = [
    "run-workflows/index.md",
    { "Configuration" = "run-workflows/configuration.md" },
    { "Exit codes" = "run-workflows/exit-codes.md" },
  ] },
  { "Build workflows" = [
    "build/index.md",
    { "Run" = [
      "build/run/index.md",
      { "Run.step()" = "build/run/step.md" },
      { "Run.worktree()" = "build/run/worktree.md" },
      { "Run.integrate()" = "build/run/integrate.md" },
      { "Run.verify()" = "build/run/verify.md" },
      { "Run.terminal" = "build/run/terminal.md" },
      { "Run.config" = "build/run/config.md" },
      { "Run.params" = "build/run/params.md" },
      { "Run.label" = "build/run/label.md" },
      { "Run.namespaces" = "build/run/namespaces.md" },
    ] },
    { "Role" = [
      "build/role/index.md",
      { "Model and effort" = "build/role/model-and-effort.md" },
      { "Accept input parameters" = "build/role/accept-input-parameters.md" },
      { "Prompt" = "build/role/prompt.md" },
      { "Restrict agent permissions" = "build/role/restrict-agent-permissions.md" },
      { "Tools and return types" = "build/role/tools-and-return-types.md" },
      { "Agent activity" = "build/role/agent-activity.md" },
    ] },
    { "Stop" = "build/stop.md" },
  ] },
  { "Download workflows" = ["download/index.md"] },
  { "Publish workflows" = ["publish/index.md"] },
  { "Examples" = ["examples/index.md"] },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
custom_dir = "overrides"
favicon = "favicon.svg"
# Otherwise every page loads its fonts from Google Fonts.
font = false
features = [
  "content.code.annotate",
  "content.code.copy",
  # Renders the HTML that autorefs puts in link titles as tooltips.
  "content.tooltips",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Listing any extension replaces all of Zensical's defaults (zensical#508).
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
# Resolved against the working directory, so build from the repository root.
pymdownx.snippets.base_path = ["tests/docs"]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
# Tables split at the `|` of a union type in the Markdown copies.
docstring_section_style = "list"
show_root_heading = true
# Every `:::` block sits under a page's `## Reference` heading.
heading_level = 3
# mkdocstrings shows source by default.
show_source = false
relative_crossrefs = true
scoped_crossrefs = true

# Zensical ignores this table; llmstxt-standalone reads it after the build.
[project.plugins.llmstxt]
markdown_description = "AGL runs AI agent workflows against code repositories."
full_output = "llms-full.txt"

# Only the pages listed here get a Markdown copy, and with none listed the check fails.
[project.plugins.llmstxt.sections]
"Home" = ["index.md"]
"Run workflows" = [
  "run-workflows/index.md",
  "run-workflows/configuration.md",
  "run-workflows/exit-codes.md",
]
"Build workflows" = [
  "build/index.md",
  "build/run/index.md",
  "build/run/step.md",
  "build/run/worktree.md",
  "build/run/integrate.md",
  "build/run/verify.md",
  "build/run/terminal.md",
  "build/run/config.md",
  "build/run/params.md",
  "build/run/label.md",
  "build/run/namespaces.md",
  "build/role/index.md",
  "build/role/model-and-effort.md",
  "build/role/accept-input-parameters.md",
  "build/role/prompt.md",
  "build/role/restrict-agent-permissions.md",
  "build/role/tools-and-return-types.md",
  "build/role/agent-activity.md",
  "build/stop.md",
]
"Download workflows" = ["download/index.md"]
"Publish workflows" = ["publish/index.md"]
"Examples" = ["examples/index.md"]
